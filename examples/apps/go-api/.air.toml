root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main ."
bin = "./tmp/main"
entrypoint = ["./tmp/main"]
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["tmp", "vendor", "testdata"]
exclude_regex = ["_test\\.go"]
delay = 1000
# Needed for reliable reload with Docker bind mounts (especially Docker Desktop).
poll = true
poll_interval = 500

[log]
time = false

[misc]
clean_on_exit = true
